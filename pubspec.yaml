name: vnumero_app
description: >
  Número Virtual App-to-App com Chamadas (WebRTC) e Mensagens.
  Base do softphone adaptada de manaoscloud/mnscloud-phoneweb.
publish_to: "none"
version: 0.1.30

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Backend (Auth + Postgres + Realtime como sinalizador WebRTC)
  supabase_flutter: ^2.5.6

  # Persistência local (mensagens, contatos, número ativo)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # VoIP App-to-App (WebRTC puro, sem SIP — Fase 3)
  flutter_webrtc: ^0.11.5

  # Chamadas recebidas em segundo plano (Fase 3 — push + tela nativa)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_callkit_incoming: ^2.0.4+2

  # Utilitários
  uuid: ^4.4.0
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Geração de código do Isar
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11

dependency_overrides:
  isar_flutter_libs: ^3.1.0+1

flutter:
  uses-material-design: true
