name: mnscloud_phoneweb
description: Public standalone Flutter WebRTC softphone for SIP over secure WebSocket providers.
publish_to: "none"
version: 0.1.27

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Dependências ORIGINAIS do fork (não alteradas) ---
  cupertino_icons: ^1.0.8
  flutter_contacts: ^2.0.2
  flutter_secure_storage: ^10.3.0
  flutter_webrtc: ^1.4.1
  go_router: ^16.2.2
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  sip_ua:
    path: third_party/sip_ua
  web: ^1.1.1

  # --- Adições VNumero (login, número virtual, chat, push de chamada) ---
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  uuid: ^4.4.0
  intl: ^0.20.3
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_callkit_incoming: ^2.0.4+2
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  record: ^6.0.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/ringback_tone.mp3
